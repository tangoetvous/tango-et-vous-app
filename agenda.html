<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda — Tango &amp; Vous</title>
  <style>
    :root {
      --bg: #0d0d0d; --border: #222; --text: #f0f0f0; --text-dim: #aaa;
      --text-faint: #555; --gold: #D4AF37; --gold-pale: #1a1508;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; }
    #loading { text-align: center; padding: 40px 20px; color: var(--text-faint); font-size: 14px; }
    .agenda-filters { display: flex; gap: 8px; padding: 14px 20px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; border-bottom: 1px solid var(--border); }
    .agenda-filters::-webkit-scrollbar { display: none; }
    .agenda-filter-btn { background: #1a1a1a; border: 1px solid #333; color: var(--text-dim); padding: 6px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .agenda-filter-btn.active { background: var(--gold-pale); border-color: var(--gold); color: var(--gold); }
    .agenda-month-header { padding: 14px 20px 4px; font-size: 10px; letter-spacing: 3px; color: var(--text-faint); text-transform: uppercase; }
    .event-item { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid #161616; }
    .event-date-col { flex-shrink: 0; text-align: center; width: 38px; }
    .event-day { font-family: Georgia, serif; font-size: 24px; font-weight: 300; color: #fff; line-height: 1; }
    .event-month-lbl { font-size: 9px; letter-spacing: 1px; color: #fff; text-transform: uppercase; }
    .event-type-bar { width: 3px; height: 36px; border-radius: 2px; flex-shrink: 0; }
    .event-info { flex: 1; min-width: 0; }
    .event-type-lbl { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; margin-bottom: 2px; }
    .event-title { font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .event-sub { font-size: 13px; color: var(--gold); margin-top: 2px; font-weight: 500; }
    .event-item.event-stage { cursor: pointer; align-items: flex-start; }
    .event-item.event-stage:hover { background: rgba(212,175,55,.06); }
    .event-type-bar-stretch { align-self: stretch; height: auto !important; }
    .event-slot-row { font-size: 14px; color: var(--text-dim); margin-top: 3px; line-height: 1.5; }
    .event-slot-hr { font-size: 13px; color: var(--gold); font-weight: 600; margin-right: 6px; }
    .event-slot-lieu { font-size: 13px; color: #999; margin-top: 5px; }
    .event-stage-inscr { display: inline-block; margin-top: 8px; padding: 4px 12px; border: 1px solid var(--gold); border-radius: 5px; font-size: 11px; letter-spacing: .8px; text-transform: uppercase; color: var(--gold); font-weight: 700; }
    .empty-msg { text-align: center; padding: 40px 20px; color: var(--text-faint); font-size: 14px; }
    .error-msg { text-align: center; padding: 40px 20px; color: #e57373; font-size: 14px; }
  </style>
</head>
<body>
<div id="app"><div id="loading">Chargement…</div></div>
<script>
'use strict';
var SUPABASE_URL  = 'https://qhngqzvvllktuwspojxc.supabase.co';
var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFobmdxenZ2bGxrdHV3c3BvanhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MjQ0NDYsImV4cCI6MjA5MjMwMDQ0Nn0.j-yMQryi3qoImIf6vyiqQ3SKzHeJoPsrJuP1YwaSyLs';

var MOIS_COURT = ['Jan',' F\xe9v','Mars','Avr','Mai','Juin','Juil','Ao\xfbt','Sept','Oct','Nov','D\xe9c'];
var MOIS_LONG  = ['janvier','f\xe9vrier','mars','avril','mai','juin','juillet','ao\xfbt','septembre','octobre','novembre','d\xe9cembre'];
var COLOR_PARIS = '#60b0ff'; var COLOR_VINC = '#40d8c0'; var COLOR_STAGE = '#D4AF37'; var COLOR_YOGA = '#a78bfa';

var COURS_PARIS = [], COURS_VINCENNES = [], COURS_YOGA = [], STAGES_DATA = [];
var HP_DEB = '', HP_INT = '', HV_DEB = '', HV_INT = '', HY_YIN = '', HY_HTH = '', HST = {};
var LP_NOM = '', LP_RUE = '', LP_TPT = '', LV_NOM = '', LV_RUE = '', LV_TPT = '';
var LY_NOM = '', LY_RUE = '', LY_TPT = '', LST_NOM = '', LST_RUE = '';
var currentFilter = 'tous';

function _sai() {
  var d = new Date(), m = d.getMonth() + 1, y = d.getFullYear();
  return m >= 9 ? y + '-' + (y + 1) : (y - 1) + '-' + y;
}
function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function sendHeight() {
  try { window.parent.postMessage({ type: 'tevHeight', height: document.body.scrollHeight }, '*'); } catch(e) {}
}
function getEventColor(s) {
  return s === 'paris' ? COLOR_PARIS : s === 'vincennes' ? COLOR_VINC : s === 'stage' ? COLOR_STAGE : s === 'yoga' ? COLOR_YOGA : '#888';
}
function getEventLabel(s) {
  return s === 'paris' ? 'Tango Paris' : s === 'vincennes' ? 'Tango Vincennes' : s === 'stage' ? 'Stage' : s === 'yoga' ? 'Yoga' : '';
}

function buildAllEvents(filter) {
  var today = todayStr();
  var sai = _sai();
  var maxStr = parseInt(sai.split('-')[1]) + '-08-31';
  var events = [];

  var lieuP = LP_NOM + (LP_RUE ? ' — ' + LP_RUE : '') + (LP_TPT ? ' \xb7 ' + LP_TPT : '');
  var lieuV = LV_NOM + (LV_RUE ? ' — ' + LV_RUE : '') + (LV_TPT ? ' \xb7 ' + LV_TPT : '');
  var lieuY = LY_NOM + (LY_RUE ? ' — ' + LY_RUE : '') + (LY_TPT ? ' \xb7 ' + LY_TPT : '');

  if (filter === 'tous' || filter === 'paris') {
    COURS_PARIS.filter(function(d) { return d >= today && d <= maxStr; }).forEach(function(d) {
      if (HP_DEB) events.push({ date: d, subtype: 'paris', titre: 'Cours D\xe9butant — Paris', heure: HP_DEB, lieu: lieuP });
      if (HP_INT) events.push({ date: d, subtype: 'paris', titre: 'Cours Interm\xe9diaire & Avanc\xe9 — Paris', heure: HP_INT, lieu: lieuP });
    });
  }
  if (filter === 'tous' || filter === 'vincennes') {
    COURS_VINCENNES.filter(function(d) { return d >= today && d <= maxStr; }).forEach(function(d) {
      if (HV_DEB) events.push({ date: d, subtype: 'vincennes', titre: 'Cours D\xe9butant — Vincennes', heure: HV_DEB, lieu: lieuV });
      if (HV_INT) events.push({ date: d, subtype: 'vincennes', titre: 'Cours Interm\xe9diaire & Avanc\xe9 — Vincennes', heure: HV_INT, lieu: lieuV });
    });
  }
  if (filter === 'tous' || filter === 'yoga') {
    COURS_YOGA.filter(function(d) { return d >= today && d <= maxStr; }).forEach(function(d) {
      if (HY_YIN) events.push({ date: d, subtype: 'yoga', titre: '🌙 Yin Yoga', heure: HY_YIN, lieu: lieuY });
      if (HY_HTH) events.push({ date: d, subtype: 'yoga', titre: '☀️ Hatha Yoga', heure: HY_HTH, lieu: lieuY });
    });
  }
  if (filter === 'tous' || filter === 'stage') {
    var TL = { technique: 'Technique', stage1: 'Stage 1', stage2: 'Stage 2', stage3: 'Stage 3', stage4: 'Stage 4' };
    var TH = { technique: 'tech', stage1: 's1', stage2: 's2', stage3: 's3', stage4: 's4' };
    STAGES_DATA.filter(function(s) { return s.date >= today && s.date <= maxStr; }).forEach(function(s) {
      var hor = Object.assign({}, HST, s.horaires || {});
      var slots = [];
      if (s.slots && s.slots.length) {
        s.slots.forEach(function(sl) {
          var deb = sl.horaire_debut || hor[(TH[sl.type] || sl.type) + '_deb'] || '';
          var fin = sl.horaire_fin  || hor[(TH[sl.type] || sl.type) + '_fin'] || '';
          if (deb) { var lbl = TL[sl.type] || sl.type; slots.push({ heure: deb + (fin ? '–' + fin : ''), titre: sl.theme ? lbl + ' — ' + sl.theme : lbl }); }
        });
      } else {
        var n = s.nStages || 2;
        if (s.technique !== false && hor.tech_deb) slots.push({ heure: hor.tech_deb + '–' + (hor.tech_fin || ''), titre: 'Technique' + (s.tech ? ' — ' + s.tech : '') });
        var sn = [s.s1, s.s2, s.s3, s.s4], sd = ['s1_deb','s2_deb','s3_deb','s4_deb'], sf = ['s1_fin','s2_fin','s3_fin','s4_fin'];
        for (var si = 0; si < n; si++) {
          if (hor[sd[si]]) { var t = sn[si] || ''; slots.push({ heure: hor[sd[si]] + '–' + (hor[sf[si]] || ''), titre: 'Stage ' + (si + 1) + (t ? ' — ' + t : '') }); }
        }
      }
      if (!slots.length) return;
      slots.sort(function(a, b) { return (a.heure || '').localeCompare(b.heure || ''); });
      var sNom = (s.adresse && s.adresse.nom) ? s.adresse.nom : LST_NOM;
      var sRue = (s.adresse && s.adresse.rue) ? s.adresse.rue : LST_RUE;
      var hMin = slots[0].heure.split('–')[0];
      var hMax = slots[slots.length - 1].heure.split('–')[1] || '';
      events.push({ date: s.date, subtype: 'stage', titre: s.nom || 'Stage de Tango',
        heure: hMin + (hMax ? '–' + hMax : ''), lieu: sNom + (sRue ? ', ' + sRue : ''), slots: slots });
    });
  }
  events.sort(function(a, b) {
    var dc = a.date.localeCompare(b.date);
    return dc !== 0 ? dc : (a.heure || '').localeCompare(b.heure || '');
  });
  return events;
}

function renderAgendaList(filter) {
  var events = buildAllEvents(filter);
  var el = document.getElementById('agenda-list');
  if (!el) return;
  if (!events.length) { el.innerHTML = '<p class="empty-msg">Aucun \xe9v\xe9nement \xe0 venir.</p>'; sendHeight(); return; }
  var html = '', lastMonth = '', lastDate = '';
  events.forEach(function(e) {
    var d = new Date(e.date + 'T00:00:00');
    var mk = d.getMonth() + '-' + d.getFullYear();
    if (mk !== lastMonth) {
      var ml = MOIS_LONG[d.getMonth()];
      html += '<div class="agenda-month-header">' + ml.charAt(0).toUpperCase() + ml.slice(1) + ' ' + d.getFullYear() + '</div>';
      lastMonth = mk;
    }
    var same = (e.date === lastDate); lastDate = e.date;
    var color = getEventColor(e.subtype), lbl = getEventLabel(e.subtype), isStage = (e.subtype === 'stage');
    var sub;
    if (isStage && e.slots && e.slots.length) {
      sub = e.slots.map(function(sl) {
        return '<div class="event-slot-row"><span class="event-slot-hr">' + sl.heure + '</span>' + sl.titre + '</div>';
      }).join('');
      if (e.lieu) sub += '<div class="event-slot-lieu">' + e.lieu + '</div>';
      sub += '<div class="event-stage-inscr">S\'inscrire →</div>';
    } else {
      sub = '<div class="event-sub">' + (e.heure || '') + (e.lieu ? ' \xb7 ' + e.lieu : '') + '</div>';
    }
    html += '<div class="event-item' + (isStage ? ' event-stage' : '') + '"' +
      (isStage ? ' onclick="window.open(\'https://app.tangoetvous.fr/stages-pwa.html\',\'_blank\')"' : '') + '>' +
      '<div class="event-date-col"' + (same ? ' style="visibility:hidden;"' : '') + '>' +
        '<div class="event-day">' + d.getDate() + '</div>' +
        '<div class="event-month-lbl">' + MOIS_COURT[d.getMonth()] + '</div>' +
      '</div>' +
      '<div class="event-type-bar' + (isStage ? ' event-type-bar-stretch' : '') + '" style="background:' + color + '"></div>' +
      '<div class="event-info">' +
        '<div class="event-type-lbl" style="color:' + color + '">' + lbl + '</div>' +
        '<div class="event-title">' + e.titre + '</div>' +
        sub +
      '</div></div>';
  });
  el.innerHTML = html;
  sendHeight();
}

function renderAgenda(filter) {
  filter = filter || currentFilter; currentFilter = filter;
  var F = [
    { id: 'tous', label: 'Tous' },
    { id: 'paris', label: 'Paris' },
    { id: 'vincennes', label: 'Vincennes' },
    { id: 'yoga', label: '🧘 Yoga' },
    { id: 'stage', label: 'Stages' }
  ];
  document.getElementById('app').innerHTML =
    '<div class="agenda-filters">' +
    F.map(function(f) {
      return '<button class="agenda-filter-btn' + (f.id === filter ? ' active' : '') + '" onclick="renderAgenda(\'' + f.id + '\')">' + f.label + '</button>';
    }).join('') +
    '</div><div id="agenda-list"></div>';
  renderAgendaList(filter);
}

function parseVal(v) {
  if (!v) return {};
  if (typeof v === 'string') { try { return JSON.parse(v); } catch(e) { return {}; } }
  return v;
}

function loadData() {
  var sai = _sai(), parts = sai.split('-');
  var saiNext = (parseInt(parts[0]) + 1) + '-' + (parseInt(parts[1]) + 1);
  return fetch(SUPABASE_URL + '/rest/v1/parametres?select=cle,valeur', {
    headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON }
  }).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(rows) {
    var p = {};
    (rows || []).forEach(function(row) { p[row.cle] = parseVal(row.valeur); });

    var cd = p['tev_cours_dates'] || {};
    COURS_PARIS     = Array.isArray(cd.paris)     ? cd.paris     : [];
    COURS_VINCENNES = Array.isArray(cd.vincennes) ? cd.vincennes : [];
    COURS_YOGA      = Array.isArray(cd.yoga)      ? cd.yoga      : [];

    var pp = p['tev_params_paris_' + sai] || {}, ph = pp.horaires || {};
    HP_DEB = (ph.deb && ph.deb_fin) ? ph.deb + '–' + ph.deb_fin : (ph.deb || '');
    HP_INT = (ph.int && ph.int_fin) ? ph.int + '–' + ph.int_fin : (ph.int || '');
    var pa = pp.adresse || {}; LP_NOM = pa.nom || ''; LP_RUE = pa.rue || ''; LP_TPT = pa.transport || '';

    var vp = p['tev_params_vincennes_' + sai] || {}, vh = vp.horaires || {};
    HV_DEB = (vh.deb && vh.deb_fin) ? vh.deb + '–' + vh.deb_fin : (vh.deb || '');
    HV_INT = (vh.int && vh.int_fin) ? vh.int + '–' + vh.int_fin : (vh.int || '');
    var va = vp.adresse || {}; LV_NOM = va.nom || ''; LV_RUE = va.rue || ''; LV_TPT = va.transport || '';

    var yp = p['tev_params_yoga_' + sai] || {}, yh = yp.horaires || {};
    HY_YIN = (typeof yh.yin === 'string' && yh.yin) ? yh.yin + (yh.yin_fin ? '–' + yh.yin_fin : '') : '';
    HY_HTH = (typeof yh.hatha === 'string' && yh.hatha) ? yh.hatha + (yh.hatha_fin ? '–' + yh.hatha_fin : '') : '';
    var ya = yp.adresse || {}; LY_NOM = ya.nom || ''; LY_RUE = ya.rue || ''; LY_TPT = ya.transport || '';

    var sp = p['tev_params_stages_' + sai] || {};
    HST = sp.horaires || {};
    var sa = sp.adresse || {}; LST_NOM = sa.nom || ''; LST_RUE = sa.rue || '';

    var dsCur  = p['tev_dates_stages_' + sai]     || {};
    var dsNext = p['tev_dates_stages_' + saiNext] || {};
    var allSt  = (Array.isArray(dsCur.stages)  ? dsCur.stages  : [])
                 .concat(Array.isArray(dsNext.stages) ? dsNext.stages : []);
    STAGES_DATA = allSt.filter(function(s) { return s && s.date; }).map(function(s) {
      var th = Array.isArray(s.themes) ? s.themes : [];
      return {
        date: s.date, nom: s.nom || s.label || '',
        technique: s.technique !== false, nStages: s.nStages || 2,
        tech: '', s1: th[0] || '', s2: th[1] || '', s3: th[2] || '', s4: th[3] || '',
        horaires: s.horaires || null, adresse: s.adresse || null,
        slots: (Array.isArray(s.slots) && s.slots.length) ? s.slots : null
      };
    });
    STAGES_DATA.sort(function(a, b) { return a.date.localeCompare(b.date); });
  });
}

loadData()
  .then(function() { renderAgenda('tous'); })
  .catch(function(err) {
    console.error('[agenda] loadData error', err);
    document.getElementById('app').innerHTML = '<p class="error-msg">Impossible de charger les donn\xe9es. Veuillez r\xe9essayer.</p>';
    sendHeight();
  });

if (window.ResizeObserver) {
  new ResizeObserver(function() { sendHeight(); }).observe(document.body);
}
</script>
</body>
</html>
