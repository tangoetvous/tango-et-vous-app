<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planning — Tango & Vous</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
      background: #fff;
      color: #222;
      font-size: 14px;
      line-height: 1.5;
    }

    #agenda-wrap {
      max-width: 740px;
      margin: 0 auto;
      padding: 28px 16px 48px;
    }

    /* ── Header ── */
    .agd-brand {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 5px;
      color: #D4AF37;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .agd-saison {
      text-align: center;
      font-size: 10px;
      letter-spacing: 3px;
      color: #aaa;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    /* ── Section ── */
    .agd-section {
      margin-bottom: 36px;
    }
    .agd-section-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }
    .agd-section-head::after {
      content: '';
      flex: 1;
      height: 1px;
      background: currentColor;
      opacity: .18;
    }
    .agd-section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .agd-section-label.tango  { color: #1a237e; }
    .agd-section-label.yoga   { color: #2e7d32; }
    .agd-section-label.stages { color: #6a1b9a; }
    .agd-section-head.tango  { color: #1a237e; }
    .agd-section-head.yoga   { color: #2e7d32; }
    .agd-section-head.stages { color: #6a1b9a; }

    /* ── Cards ── */
    .agd-card {
      border-radius: 12px;
      border: 1px solid #e8e8e8;
      padding: 20px 22px;
      margin-bottom: 14px;
      background: #fff;
    }

    /* Card header row */
    .agd-card-top {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .agd-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
    }
    .agd-badge.gold   { background: #D4AF37; color: #111; }
    .agd-badge.tango  { background: #1a237e; color: #fff; }
    .agd-badge.yoga   { background: #2e7d32; color: #fff; }
    .agd-badge.stages { background: #6a1b9a; color: #fff; }

    .agd-jour {
      font-size: 13px;
      color: #666;
      font-weight: 400;
    }

    /* Next date */
    .agd-next {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 14px;
    }
    .agd-next.tango  { color: #1a237e; }
    .agd-next.yoga   { color: #2e7d32; }
    .agd-next.stages { color: #6a1b9a; }

    /* Niveaux grid */
    .agd-niveaux {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .agd-niveau {
      flex: 1;
      min-width: 150px;
      background: #f5f5f5;
      border-radius: 8px;
      padding: 12px 14px;
    }
    .agd-niveau-titre {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 4px;
    }
    .agd-niveau-horaire {
      font-size: 19px;
      font-weight: 700;
      color: #111;
      letter-spacing: -.5px;
    }

    /* Adresse */
    .agd-adr {
      border-top: 1px solid #f0f0f0;
      padding-top: 14px;
      margin-top: 4px;
    }
    .agd-adr-nom {
      font-size: 13px;
      font-weight: 700;
      color: #333;
      margin-bottom: 2px;
    }
    .agd-adr-rue {
      font-size: 12px;
      color: #666;
      margin-bottom: 2px;
    }
    .agd-adr-transport {
      font-size: 12px;
      color: #888;
      margin-bottom: 6px;
    }
    .agd-adr-link {
      font-size: 12px;
      color: #D4AF37;
      text-decoration: none;
      font-weight: 600;
    }
    .agd-adr-link:hover { text-decoration: underline; }

    /* Inscription button */
    .agd-btn-wrap { margin-top: 16px; }
    .agd-btn {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: none;
      padding: 9px 22px;
      border-radius: 6px;
    }
    .agd-btn.gold   { background: #D4AF37; color: #111; }
    .agd-btn.green  { background: #2e7d32; color: #fff; }
    .agd-btn.purple { background: #6a1b9a; color: #fff; }
    .agd-btn.navy   { background: #1a237e; color: #fff; }

    /* Stage card specifics */
    .agd-stage-date {
      font-size: 15px;
      font-weight: 700;
      color: #6a1b9a;
      margin-bottom: 14px;
    }
    .agd-slots { margin-bottom: 4px; }
    .agd-slot {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 7px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .agd-slot:last-child { border-bottom: none; }
    .agd-slot-horaire {
      font-size: 13px;
      font-weight: 700;
      color: #111;
      min-width: 90px;
      flex-shrink: 0;
    }
    .agd-slot-theme {
      font-size: 13px;
      color: #444;
    }
    .agd-slot-type {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #aaa;
    }

    /* Loading / error states */
    #agd-loading {
      text-align: center;
      padding: 48px 16px;
      color: #bbb;
      font-size: 13px;
    }
    #agd-main { display: none; }

    /* No section */
    .agd-empty {
      text-align: center;
      padding: 16px;
      color: #bbb;
      font-size: 13px;
      font-style: italic;
    }

    @media (max-width: 480px) {
      .agd-niveaux { flex-direction: column; }
      .agd-niveau { min-width: unset; }
      .agd-niveau-horaire { font-size: 17px; }
    }
  </style>
</head>
<body>
<div id="agenda-wrap">
  <div id="agd-loading">Chargement du planning…</div>
  <div id="agd-main">
    <p class="agd-brand">Tango &amp; Vous</p>
    <p id="agd-saison" class="agd-saison"></p>

    <div id="sec-tango"  class="agd-section" style="display:none;"></div>
    <div id="sec-yoga"   class="agd-section" style="display:none;"></div>
    <div id="sec-stages" class="agd-section" style="display:none;"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function() {
  'use strict';

  var SB_URL = 'https://qhngqzvvllktuwspojxc.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFobmdxenZ2bGxrdHV3c3BvanhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MjQ0NDYsImV4cCI6MjA5MjMwMDQ0Nn0.j-yMQryi3qoImIf6vyiqQ3SKzHeJoPsrJuP1YwaSyLs';
  var sb = supabase.createClient(SB_URL, SB_KEY);

  var JOURS = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
  var JOURS_C = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  var MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

  function saisonActive() {
    var now = new Date(), yr = now.getFullYear(), mo = now.getMonth() + 1;
    return mo >= 9 ? yr + '-' + (yr + 1) : (yr - 1) + '-' + yr;
  }

  function saisonSuivante() {
    var sai = saisonActive(), p = sai.split('-');
    return (parseInt(p[0]) + 1) + '-' + (parseInt(p[1]) + 1);
  }

  function todayISO() {
    return new Date().toISOString().slice(0, 10);
  }

  function parseVal(v) {
    if (!v) return {};
    if (typeof v === 'string') { try { return JSON.parse(v); } catch(e) { return {}; } }
    return v;
  }

  function dt(iso) {
    return new Date(iso + 'T12:00:00');
  }

  function fmtLong(iso) {
    var d = dt(iso);
    return JOURS_C[d.getDay()] + ' ' + d.getDate() + ' ' + MOIS[d.getMonth()] + ' ' + d.getFullYear();
  }

  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function sendH() {
    var h = document.getElementById('agenda-wrap') ? document.getElementById('agenda-wrap').scrollHeight : document.body.scrollHeight;
    try { window.parent.postMessage({ type: 'tevHeight', height: h }, '*'); } catch(e) {}
  }

  // ── Adresse block ──────────────────────────────────────────────
  function htmlAdr(adr) {
    if (!adr || !adr.nom) return '';
    var mapsUrl = adr.gps ? 'https://maps.google.com/?q=' + encodeURIComponent(adr.gps) : (adr.metrogps ? 'https://maps.google.com/?q=' + encodeURIComponent(adr.metrogps) : '');
    return '<div class="agd-adr">' +
      '<div class="agd-adr-nom">📍 ' + esc(adr.nom) + '</div>' +
      (adr.rue ? '<div class="agd-adr-rue">' + esc(adr.rue) + '</div>' : '') +
      (adr.transport ? '<div class="agd-adr-transport">🚇 ' + esc(adr.transport) + '</div>' : '') +
      (mapsUrl ? '<a href="' + esc(mapsUrl) + '" target="_blank" rel="noopener" class="agd-adr-link">Voir sur Google Maps →</a>' : '') +
      '</div>';
  }

  // ── Tango city card ────────────────────────────────────────────
  function htmlTangoVille(pms, coursDates, villeKey, libelleVille, lienInscr) {
    var hor = pms.horaires || {};
    var adr = pms.adresse || {};
    if (!hor.deb && !hor.int) return '';

    var today = todayISO();
    var cityDates = (coursDates[villeKey] || []).filter(function(d) { return d >= today; }).sort();
    var nextDate = cityDates[0] || null;
    var jourLabel = nextDate ? 'Le ' + JOURS[dt(nextDate).getDay()] : '';

    var html = '<div class="agd-card">';

    // Top row
    html += '<div class="agd-card-top">';
    html += '<span class="agd-badge gold">' + esc(libelleVille) + '</span>';
    if (jourLabel) html += '<span class="agd-jour">' + esc(jourLabel) + '</span>';
    html += '</div>';

    // Next date
    if (nextDate) {
      html += '<div class="agd-next tango">Prochain cours : ' + fmtLong(nextDate) + '</div>';
    }

    // Niveaux
    html += '<div class="agd-niveaux">';
    if (hor.deb) {
      var hDeb = hor.deb + (hor.deb_fin ? ' – ' + hor.deb_fin : '');
      html += '<div class="agd-niveau"><div class="agd-niveau-titre">Débutants</div><div class="agd-niveau-horaire">' + esc(hDeb) + '</div></div>';
    }
    if (hor.int) {
      var hInt = hor.int + (hor.int_fin ? ' – ' + hor.int_fin : '');
      html += '<div class="agd-niveau"><div class="agd-niveau-titre">Intermédiaires</div><div class="agd-niveau-horaire">' + esc(hInt) + '</div></div>';
    }
    html += '</div>';

    // Adresse
    html += htmlAdr(adr);

    // S'inscrire button
    if (lienInscr) {
      html += '<div class="agd-btn-wrap"><a href="' + esc(lienInscr) + '" target="_blank" rel="noopener" class="agd-btn navy">S\'inscrire →</a></div>';
    }

    html += '</div>';
    return html;
  }

  // ── Yoga card ──────────────────────────────────────────────────
  function htmlYoga(pms, coursDates, lienInscr) {
    var hor = pms.horaires || {};
    var adr = pms.adresse || {};
    if (!hor.yin && !hor.hatha) return '';

    var today = todayISO();
    var yogaDates = (coursDates.yoga || []).filter(function(d) { return d >= today; }).sort();
    var nextDate = yogaDates[0] || null;

    var html = '<div class="agd-card">';

    html += '<div class="agd-card-top">';
    html += '<span class="agd-badge yoga">Yoga</span>';
    html += '<span class="agd-jour">avec Florencia Garcia</span>';
    html += '</div>';

    if (nextDate) {
      html += '<div class="agd-next yoga">Prochain cours : ' + fmtLong(nextDate) + '</div>';
    }

    html += '<div class="agd-niveaux">';
    if (hor.yin) {
      var hYin = hor.yin + (hor.yin_fin ? ' – ' + hor.yin_fin : '');
      html += '<div class="agd-niveau"><div class="agd-niveau-titre">Yin Yoga</div><div class="agd-niveau-horaire">' + esc(hYin) + '</div></div>';
    }
    if (hor.hatha) {
      var hHatha = hor.hatha + (hor.hatha_fin ? ' – ' + hor.hatha_fin : '');
      html += '<div class="agd-niveau"><div class="agd-niveau-titre">Hatha Yoga</div><div class="agd-niveau-horaire">' + esc(hHatha) + '</div></div>';
    }
    html += '</div>';

    html += htmlAdr(adr);

    if (lienInscr) {
      html += '<div class="agd-btn-wrap"><a href="' + esc(lienInscr) + '" target="_blank" rel="noopener" class="agd-btn green">S\'inscrire →</a></div>';
    }

    html += '</div>';
    return html;
  }

  // ── One stage date card ────────────────────────────────────────
  function htmlStageCard(stage, defAdr, lienInscr) {
    var slots = stage.slots || [];
    if (!slots.length) return '';

    var adr = (stage.adresse && stage.adresse.nom) ? stage.adresse : defAdr;

    var html = '<div class="agd-card">';
    html += '<div class="agd-stage-date">🗓 ' + fmtLong(stage.date) + '</div>';

    // Slots
    html += '<div class="agd-slots">';
    slots.forEach(function(s) {
      var horaire = [s.horaire_debut, s.horaire_fin].filter(Boolean).join(' – ');
      var theme = (s.theme || '').trim();
      var typeLabel = s.type === 'technique' ? 'Technique' : '';

      html += '<div class="agd-slot">';
      if (horaire) html += '<span class="agd-slot-horaire">' + esc(horaire) + '</span>';
      if (theme) {
        html += '<span class="agd-slot-theme">' + esc(theme) + '</span>';
      } else if (typeLabel) {
        html += '<span class="agd-slot-type">' + esc(typeLabel) + '</span>';
      }
      html += '</div>';
    });
    html += '</div>';

    html += htmlAdr(adr);

    if (lienInscr) {
      html += '<div class="agd-btn-wrap"><a href="' + esc(lienInscr) + '" target="_blank" rel="noopener" class="agd-btn purple">S\'inscrire →</a></div>';
    }

    html += '</div>';
    return html;
  }

  // ── Section wrapper ────────────────────────────────────────────
  function htmlSection(icone, label, cssClass, content) {
    return '<div class="agd-section-head ' + cssClass + '">' +
      '<span class="agd-section-label ' + cssClass + '">' + icone + ' ' + esc(label) + '</span>' +
      '</div>' + content;
  }

  // ── Main ───────────────────────────────────────────────────────
  async function init() {
    var sai = saisonActive();
    var saiNext = saisonSuivante();
    var today = todayISO();

    document.getElementById('agd-saison').textContent = 'Saison ' + sai;

    try {
      var res = await sb.from('parametres').select('cle,valeur');
      if (res.error) throw res.error;

      var pmap = {};
      (res.data || []).forEach(function(r) { pmap[r.cle] = parseVal(r.valeur); });

      var parisPms    = pmap['tev_params_paris_'     + sai] || {};
      var vincPms     = pmap['tev_params_vincennes_'  + sai] || {};
      var yogaPms     = pmap['tev_params_yoga_'       + sai] || {};
      var stagesPms   = pmap['tev_params_stages_'     + sai] || {};
      var stagesDates = pmap['tev_dates_stages_'      + sai] || {};
      var stagesNext  = pmap['tev_dates_stages_'      + saiNext] || {};
      var coursDates  = pmap['tev_cours_dates']               || {};
      var liensAc     = pmap['tev_liens_assoconnect']         || {};

      var lienTango   = 'https://app.tangoetvous.fr/inscription-cours.html';
      var lienYoga    = 'https://app.tangoetvous.fr/essai-yoga.html';
      var lienStages  = 'https://app.tangoetvous.fr/stages-pwa.html';

      // Prefer AssoConnect links from params if admin has set them
      if (liensAc[sai] && liensAc[sai].cours) lienTango = liensAc[sai].cours;
      if (liensAc[sai] && liensAc[sai].yoga)  lienYoga  = liensAc[sai].yoga;

      // ── TANGO ────────────────────────────────────────────────
      var tangoContent = '';
      tangoContent += htmlTangoVille(parisPms, coursDates, 'paris',     'Paris',     lienTango);
      tangoContent += htmlTangoVille(vincPms,  coursDates, 'vincennes', 'Vincennes', lienTango);

      if (tangoContent) {
        document.getElementById('sec-tango').innerHTML =
          htmlSection('🎶', 'Cours de Tango Argentin', 'tango', tangoContent);
        document.getElementById('sec-tango').style.display = '';
      }

      // ── YOGA ─────────────────────────────────────────────────
      var yogaContent = htmlYoga(yogaPms, coursDates, lienYoga);
      if (yogaContent) {
        document.getElementById('sec-yoga').innerHTML =
          htmlSection('🧘', 'Cours de Yoga', 'yoga', yogaContent);
        document.getElementById('sec-yoga').style.display = '';
      }

      // ── STAGES ───────────────────────────────────────────────
      // Combine current and next season, filter future, sort
      var allStages = [].concat(
        (stagesDates.stages || []),
        (stagesNext.stages  || [])
      ).filter(function(s) { return s.date >= today; })
       .sort(function(a, b) { return a.date < b.date ? -1 : 1; });

      var defAdr = stagesPms.adresse || {};

      if (allStages.length) {
        var stagesContent = '';
        allStages.forEach(function(s) {
          stagesContent += htmlStageCard(s, defAdr, lienStages);
        });
        if (stagesContent) {
          document.getElementById('sec-stages').innerHTML =
            htmlSection('🎭', 'Prochains Stages', 'stages', stagesContent);
          document.getElementById('sec-stages').style.display = '';
        }
      }

    } catch(err) {
      console.error('[agenda] erreur chargement', err);
    }

    document.getElementById('agd-loading').style.display = 'none';
    document.getElementById('agd-main').style.display    = '';

    sendH();
    setTimeout(sendH, 300);
    setTimeout(sendH, 1000);
  }

  // Wix iframe height — polling + MutationObserver
  var _lastH = 0;
  setInterval(function() {
    var h = document.body.scrollHeight;
    if (h !== _lastH) { _lastH = h; sendH(); }
  }, 600);

  if (window.MutationObserver) {
    new MutationObserver(sendH).observe(document.body, { childList: true, subtree: true });
  }

  window.addEventListener('load', init);
})();
</script>
</body>
</html>
