name: Backup Données CSV

on:
  schedule:
    - cron: '0 21 * * *'  # 23h heure de Paris en été (CEST = UTC+2)
  workflow_dispatch:       # déclenchable manuellement depuis GitHub

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/dance-school-app-RTqb5

      - name: Exporter les tables Supabase en CSV
        run: |
          DATE=$(date +%Y-%m-%d)
          mkdir -p "backups/${DATE}"

          SUPABASE_URL="https://qhngqzvvllktuwspojxc.supabase.co"
          SUPABASE_KEY="${{ secrets.SUPABASE_SERVICE_KEY }}"

          TABLES="eleves inscriptions_cours cours_yoga inscriptions_stages inscriptions_essai inscriptions_essai_yoga presences cours_particuliers parametres publications agenda_modifs demandes_devis devis absences_jour milonga_presences"

          for TABLE in $TABLES; do
            STATUS=$(curl -s -o "backups/${DATE}/${TABLE}.csv" -w "%{http_code}" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              -H "Accept: text/csv" \
              "${SUPABASE_URL}/rest/v1/${TABLE}?select=*")
            if [ "$STATUS" = "200" ]; then
              LINES=$(wc -l < "backups/${DATE}/${TABLE}.csv")
              echo "✓ ${TABLE} (${LINES} lignes)"
            else
              echo "⚠️ ${TABLE} — statut HTTP ${STATUS}"
            fi
          done

          zip -j "backups/backup_${DATE}.zip" "backups/${DATE}"/*.csv
          echo "DATE=${DATE}" >> "$GITHUB_ENV"
          echo "✓ ZIP créé : backup_${DATE}.zip"

      - name: Upload artifact (téléchargeable 90 jours depuis GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ env.DATE }}
          path: backups/backup_${{ env.DATE }}.zip
          retention-days: 90

      - name: Envoyer par email
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Tango & Vous — Backup ${{ env.DATE }}"
          to: ${{ secrets.BACKUP_EMAIL }}
          from: "Tango & Vous <${{ secrets.SMTP_USERNAME }}>"
          body: |
            Backup automatique du ${{ env.DATE }}.

            Tables exportées : eleves, inscriptions_cours, cours_yoga,
            inscriptions_stages, inscriptions_essai, inscriptions_essai_yoga,
            presences, cours_particuliers, parametres, publications,
            agenda_modifs, demandes_devis, devis, absences_jour, milonga_presences.

            Le fichier ZIP est en pièce jointe.
          attachments: backups/backup_${{ env.DATE }}.zip

      # Les backups ne sont PAS commités dans le repo (données personnelles RGPD)
      # Ils sont disponibles 90 jours via GitHub Artifacts (étape ci-dessus)
