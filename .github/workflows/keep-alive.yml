name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 8 */5 * *'  # toutes les 5 jours à 8h UTC
  workflow_dispatch:        # déclenchable manuellement depuis GitHub

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: claude/dance-school-app-RTqb5

      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFobmdxenZ2bGxrdHV3c3BvanhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MjQ0NDYsImV4cCI6MjA5MjMwMDQ0Nn0.j-yMQryi3qoImIf6vyiqQ3SKzHeJoPsrJuP1YwaSyLs" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFobmdxenZ2bGxrdHV3c3BvanhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MjQ0NDYsImV4cCI6MjA5MjMwMDQ0Nn0.j-yMQryi3qoImIf6vyiqQ3SKzHeJoPsrJuP1YwaSyLs" \
            "https://qhngqzvvllktuwspojxc.supabase.co/rest/v1/eleves?select=id&limit=1")
          echo "Supabase status: $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "206" ]; then
            echo "⚠️ Réponse inattendue : $STATUS"
            exit 1
          fi
          echo "✓ Supabase actif"

      - name: Maintenir l'activité GitHub Actions
        run: |
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .keep-alive
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .keep-alive
          git diff --staged --quiet || git commit -m "chore: keep-alive $(date -u +%Y-%m-%d) [skip ci]"
          git push
