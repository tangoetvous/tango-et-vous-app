<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Tango &amp; Vous — Pointage remplaçant</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --gold:#D4AF37;--bg:#0a0a0a;--s1:#111;--s2:#181818;--s3:#222;
  --border:#2a2a2a;--text:#f0f0f0;--dim:#888;
  --ok:#4ade80;--warn:#fb923c;--err:#ef4444;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Helvetica Neue',Arial,sans-serif;font-size:15px;}
.header{background:var(--s1);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:10;}
.logo{font-family:Georgia,serif;font-size:15px;font-weight:300;letter-spacing:4px;color:var(--gold);}
.logo-sub{font-size:10px;letter-spacing:1px;color:var(--dim);text-transform:uppercase;}
.date-badge{font-size:11px;color:var(--dim);text-align:right;}
.date-badge strong{color:var(--text);display:block;font-size:13px;}
.content{max-width:560px;margin:0 auto;padding:16px;}
.section-hdr{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);padding:14px 0 8px;border-bottom:1px solid var(--border);margin-bottom:4px;}
.card-row{display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid var(--s3);}
.card-row:last-child{border-bottom:none;}
.card-name{flex:1;min-width:0;}
.card-name strong{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-name small{font-size:11px;color:var(--dim);}
.bar-wrap{display:flex;gap:4px;margin-top:4px;}
.bar-dot{width:10px;height:10px;border-radius:2px;background:var(--s3);}
.bar-dot.used{background:var(--gold);}
.bar-dot.done{background:var(--err);}
.pill{display:inline-block;font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;white-space:nowrap;}
.pill-exp{background:#2d1a00;color:var(--warn);}
.pill-ok{background:#0a1e0a;color:var(--ok);}
.pill-done{background:#1a0a0a;color:var(--err);}
.btn-pointer{padding:7px 14px;border:none;border-radius:8px;background:var(--gold);color:#000;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:opacity .15s;}
.btn-pointer:disabled{opacity:.4;cursor:default;}
.btn-pointer.pointed{background:var(--s3);color:var(--ok);cursor:default;}
.btn-pointer.skipped{background:var(--s3);color:var(--dim);cursor:default;}
.btn-refresh{padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--dim);font-size:12px;cursor:pointer;}
.btn-refresh:hover{color:var(--text);}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}
.state-box{text-align:center;padding:48px 24px;}
.state-box h2{font-size:18px;margin-bottom:8px;}
.state-box p{color:var(--dim);font-size:14px;line-height:1.6;}
.empty{color:var(--dim);font-size:13px;padding:12px 8px;font-style:italic;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:10px 20px;font-size:13px;color:var(--text);box-shadow:0 4px 20px rgba(0,0,0,.6);z-index:100;animation:toastIn .2s ease;}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.footer-info{font-size:11px;color:var(--dim);text-align:center;padding:24px 16px;line-height:1.7;}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="logo">TANGO &amp; VOUS</div>
    <div class="logo-sub">Pointage remplaçant</div>
  </div>
  <div class="date-badge">
    <strong id="hdr-date"></strong>
    <span id="hdr-cours"></span>
  </div>
</div>

<div class="content" id="content">
  <div class="state-box"><div class="spinner"></div><p style="color:var(--dim);margin-top:12px;">Chargement…</p></div>
</div>

<div class="footer-info">Lien valable uniquement aujourd'hui &bull; <a href="https://app.tangoetvous.fr" style="color:var(--gold);">app.tangoetvous.fr</a></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
  var SUPABASE_URL = 'https://qhngqzvvllktuwspojxc.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFobmdxenZ2bGxrdHV3c3BvanhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MjQ0NDYsImV4cCI6MjA5MjMwMDQ0Nn0.j-yMQryi3qoImIf6vyiqQ3SKzHeJoPsrJuP1YwaSyLs';

  var token   = new URLSearchParams(window.location.search).get('token') || '';
  var _tev    = null;
  var _data   = null;
  var _pointed = {}; // email → nb de fois pointé cette session

  function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function fmtDate(iso){
    var p=iso.split('-');
    var d=new Date(iso+'T12:00:00');
    var j=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'][d.getDay()];
    return j+' '+parseInt(p[2])+'/'+parseInt(p[1])+'/'+p[0];
  }
  function fmtExp(iso){
    if(!iso)return null;
    var p=iso.split('-');return parseInt(p[2])+'/'+parseInt(p[1])+'/'+p[0];
  }
  function daysLeft(iso){
    if(!iso)return null;
    var today=new Date();today.setHours(0,0,0,0);
    var exp=new Date(iso+'T00:00:00');
    return Math.ceil((exp-today)/86400000);
  }
  function toast(msg){
    var t=document.createElement('div'); t.className='toast'; t.textContent=msg;
    document.body.appendChild(t);
    setTimeout(function(){t.remove();},2800);
  }

  function render(data){
    _data=data;
    document.getElementById('hdr-date').textContent=fmtDate(data.date);
    var coursLabels=data.cours.map(function(c){return c.label;}).join(' & ');
    document.getElementById('hdr-cours').textContent=coursLabels;

    var html='';
    data.cours.forEach(function(group){
      html+='<div class="section-hdr">'+escHtml(group.label)+'</div>';
      if(!group.eleves.length){
        html+='<div class="empty">Aucun élève avec carte de 10 dans ce cours.</div>';
        return;
      }
      group.eleves.forEach(function(e){
        var nbPointed=_pointed[e.email]||0;
        var totalUsed=Math.min((e.utilises||0)+nbPointed,10);
        var totalRestants=Math.max((e.restants||10)-nbPointed,0);
        var days=daysLeft(e.expiration);
        var expSoon=days!==null&&days<=14&&days>=0;
        var expExp=days!==null&&days<0;
        var fini=totalRestants<=0;
        var maxToday=nbPointed>=2;

        // Barre 10 dots
        var bar='<div class="bar-wrap">';
        for(var i=0;i<10;i++){
          var cls='bar-dot';
          if(i<totalUsed)cls+= fini?' done':' used';
          bar+='<div class="'+cls+'"></div>';
        }
        bar+='</div>';

        var expHtml='';
        if(expExp)expHtml='<span class="pill pill-done">Expirée</span> ';
        else if(expSoon)expHtml='<span class="pill pill-exp">Exp. '+fmtExp(e.expiration)+'</span> ';
        else if(e.expiration)expHtml='<span class="pill pill-ok">Val. '+fmtExp(e.expiration)+'</span> ';

        var btnClass='btn-pointer';
        var btnLabel='Pointer';
        var btnDisabled='';
        if(maxToday){btnClass+=' skipped';btnLabel='2/2 max';btnDisabled='disabled';}
        else if(fini){btnClass+=' pointed';btnLabel='Carte pleine';btnDisabled='disabled';}

        html+='<div class="card-row">'
          +'<div class="card-name">'
          +'<strong>'+escHtml(e.prenom)+' '+escHtml(e.nom)+'</strong>'
          +'<small>'+totalUsed+'/10 cours utilisés · '+totalRestants+' restant'+(totalRestants>1?'s':'')+'</small>'
          +bar
          +(expHtml?'<div style="margin-top:4px;">'+expHtml+'</div>':'')
          +'</div>'
          +'<button class="'+btnClass+'" '+btnDisabled+' onclick="pointerEleve(\''+escHtml(e.email)+'\',\''+escHtml(e.prenom+' '+e.nom)+'\',this)">'+btnLabel+'</button>'
          +'</div>';
      });
    });

    html+='<div style="text-align:center;margin-top:24px;">'
      +'<button class="btn-refresh" onclick="loadData()">↻ Actualiser</button>'
      +'</div>';

    document.getElementById('content').innerHTML=html;
  }

  function showError(msg){
    document.getElementById('content').innerHTML='<div class="state-box">'
      +'<h2 style="color:var(--err);">⚠️ '+escHtml(msg)+'</h2>'
      +'<p>Vérifiez que le lien est correct et valable aujourd\'hui.</p>'
      +'</div>';
  }

  function loadData(){
    document.getElementById('content').innerHTML='<div class="state-box"><div class="spinner"></div><p style="color:var(--dim);margin-top:12px;">Chargement…</p></div>';
    fetch('/api/remplacant/data?token='+encodeURIComponent(token))
      .then(function(r){return r.json();})
      .then(function(d){
        if(d.error){showError(d.error);return;}
        render(d);
      })
      .catch(function(){showError('Erreur réseau — vérifiez votre connexion.');});
  }

  window.pointerEleve = function(email, nom, btn){
    if(btn.disabled)return;
    btn.disabled=true;
    btn.textContent='⏳';

    if(!_tev) _tev=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    var today=new Date().toISOString().split('T')[0];

    _tev.rpc('pointer_cours_qr',{p_email:email,p_date:today,p_nb:1})
      .then(function(res){
        if(res.error){
          toast('⚠️ Erreur : '+(res.error.message||res.error.code||'Problème serveur'));
          btn.disabled=false; btn.textContent='Pointer';
          return;
        }
        var d=res.data||{};
        if(d.skipped){
          _pointed[email]=(_pointed[email]||0)+2; // forcer affichage 2/2
          toast('✔️ '+nom+' — déjà au maximum aujourd\'hui');
        } else {
          _pointed[email]=(_pointed[email]||0)+1;
          var restants=d.restants!==undefined?d.restants:'—';
          toast('✅ '+nom+' — il reste '+restants+' cours');
        }
        // Re-render local (sans rechargement réseau)
        if(_data)render(_data);
      })
      .catch(function(){
        toast('⚠️ Erreur réseau — réessayez.');
        btn.disabled=false; btn.textContent='Pointer';
      });
  };

  if(!token){showError('Lien invalide — aucun token trouvé.');return;}
  loadData();
})();
</script>
</body>
</html>
